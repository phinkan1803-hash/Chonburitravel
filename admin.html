<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ผู้ดูแล • ชลบุรีมีดี</title><link rel="stylesheet" href="assets/style.css"><body><main class="admin"><a href="index.html">← กลับหน้าเว็บไซต์</a><h1 style="font-size:36px">จัดการสถานที่ท่องเที่ยว</h1><p id="status" role="status"></p><form id="login"><label>ชื่อผู้ใช้<input name="username" autocomplete="username" required></label><label>รหัสผ่าน<input name="password" type="password" autocomplete="current-password" required></label><button>เข้าสู่ระบบ</button></form><section id="panel" hidden><button id="logout">ออกจากระบบ</button><h2>เพิ่ม / แก้ไขสถานที่</h2><form id="editor"><input name="id" type="hidden"><label>ชื่อสถานที่<input name="name" maxlength="200" required></label><label>ประเภท<select name="category"><option>ทะเลและเกาะ</option><option>ธรรมชาติ</option><option>วัฒนธรรม</option><option>ชุมชนและตลาด</option><option>นันทนาการ</option><option>วัดและศาสนสถาน</option><option>คาเฟ่</option><option>พิพิธภัณฑ์และแหล่งเรียนรู้</option></select></label><label>อำเภอ<input name="district" maxlength="100" required></label><label>ประวัติความเป็นมา<textarea name="history" required maxlength="5000"></textarea></label><label>จุดเด่น<textarea name="highlight" required maxlength="5000"></textarea></label><label>คำค้นเพิ่มเติม (คั่นด้วยช่องว่าง)<input name="keywords" maxlength="2000" placeholder="เช่น วัด ไหว้พระ จุดชมวิว temple"></label><label>ที่ตั้ง<input name="address" required maxlength="500"></label><label>URL ภาพถ่าย (HTTPS และมีสิทธิ์ใช้งาน)<input name="image" type="url" placeholder="https://..."></label><label>URL แหล่งข้อมูล<input name="source" type="url" required></label><button>บันทึกข้อมูล</button> <button type="button" id="clear">ยกเลิกการแก้ไข</button></form><h2>สถานที่ทั้งหมด</h2><div id="list"></div></section></main><script src="config.js"></script><script src="assets/admin.js"></script></body></html>
